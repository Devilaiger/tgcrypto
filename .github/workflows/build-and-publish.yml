name: Build and publish wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python packaging tools (runner)
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.16.5
        with:
          output-dir: wheelhouse
        env:
          CIBW_ENVIRONMENT: "PYTHONWARNINGS=default"
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Linux: force x86_64 manylinux images only (prevents exec format errors on ubuntu runners)
          CIBW_ARCHS_LINUX: "x86_64"
          # macOS: build x86_64 / universal2 / arm64
          CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
          # Windows: use AMD64 (Windows name for x86_64)
          CIBW_ARCHS_WINDOWS: "AMD64"

          # Debug / stability: make pip/setuptools prints more verbose inside containers
          CIBW_BUILD_VERBOSITY: "3"
          # Ensure modern pip/setuptools/wheel inside the container (helpful for new metadata / build-backends)
          CIBW_BEFORE_BUILD: "python -m pip install --upgrade pip setuptools wheel || true"

      - name: Collect cibuildwheel logs (always)
        if: always()
        run: |
          mkdir -p cibuildwheel-logs || true
          # copy cibuildwheel cache (if present on the runner)
          cp -r /home/runner/.cache/cibuildwheel cibuildwheel-logs 2>/dev/null || true
          # capture last lines of the job log(s) if available
          echo "==== job log tail ====" > cibuildwheel-logs/job-tail.txt || true
          (for f in /home/runner/work/*/*/*.log 2>/dev/null; do tail -n 200 "$f" >> cibuildwheel-logs/job-tail.txt || true; done) || true
          # try to capture any temp build output from /tmp/cibuildwheel that the action may have written out to runner
          cp -r /tmp/cibuildwheel cibuildwheel-logs 2>/dev/null || true
        continue-on-error: true

      - name: Upload cibuildwheel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-logs-${{ matrix.os }}-${{ github.run_id }}
          path: cibuildwheel-logs

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgcrypto-wheels-${{ matrix.os }}-${{ github.run_id }}
          path: wheelhouse/*.whl

  publish:
    name: Publish built wheels to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download built wheels (all artifacts)
        uses: actions/download-artifact@v4
        with:
          path: .

      - name: Aggregate wheels into wheelhouse
        run: |
          set -e
          mkdir -p wheelhouse
          # copy all .whl files from any subfolder into top-level wheelhouse/
          find . -type f -name "*.whl" -print0 | xargs -0 -I{} cp -v {} wheelhouse/ || true
          echo "Collected wheels:"
          ls -la wheelhouse || true

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$(ls -A wheelhouse 2>/dev/null)" ]; then
            echo "ERROR: no wheels found in wheelhouse — aborting publish"
            exit 1
          fi
          python -m twine upload wheelhouse/*.whl
