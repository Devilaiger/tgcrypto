[build-system]
# keep setuptools at a version that works for Python 3.8..3.14 builds
requires = ["setuptools>=61,<79", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcrypto-devilaiger"
version = "1.2.5"
description = "Fast and Portable Cryptography Extension Library for Pyrogram"
readme = "README.md"
requires-python = ">=3.7,<3.15"

authors = [
  { name = "Dan", email = "dan@pyrogram.org" }
]

# Prefer SPDX identifier for clarity
license = { text = "LGPL-3.0-or-later" }

# Optional metadata that helps PyPI and users
keywords = ["crypto", "telegram", "pyrogram", "tgcrypto"]
classifiers = [
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]

[tool.cibuildwheel]
# build matrix: keep targeting many CPython versions but be careful with old/new setuptools
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-skip = ["*-win*"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]



