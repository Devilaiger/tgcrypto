[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcrypto"
version = "1.2.5"
description = "Fast and Portable Cryptography Extension Library for Pyrogram"
readme = "README.md"
requires-python = ">=3.7,<3.15"
authors = [
  { name = "Dan", email = "dan@pyrogram.org" }
]
# Use an SPDX identifier string or provide text. Avoid the old 'license-file' field.
license = { text = "LGPL-3.0-or-later" }

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-skip = ["*-win*"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
