[build-system]
# require a modern setuptools that supports project.license-files and PEP 621 metadata
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcrypto"
version = "1.2.5"
description = "Fast and Portable Cryptography Extension Library for Pyrogram"
readme = "README.md"
requires-python = ">=3.7,<3.15"
authors = [
  { name = "Dan", email = "dan@pyrogram.org" }
]
# Use an SPDX expression (single string) instead of the old TOML table
license = "LGPL-3.0-or-later"
# Ensure license files are included in the built distribution
license-files = ["COPYING.lesser", "COPYING", "NOTICE"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-skip = ["*-win*"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
